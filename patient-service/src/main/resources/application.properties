spring.application.name=patient-service
server.port=8081

# Import du .env racine — [.properties] pour choisir le bon loader ; optional pour ne pas planter si absent (Docker).
spring.config.import=optional:file:../.env[.properties]

# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/patientdb?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:patientdb}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Bridge OBLIGATOIRE : @Value("${medilabo.password-bcrypt}") tout seul ne relaxed-bind pas MEDILABO_PASSWORD_BCRYPT.
# Défaut DEV : hash bcrypt de 'medilabo123' (jamais en clair — NFR-S3).
medilabo.user=${MEDILABO_USER:medilabo}
medilabo.password-bcrypt=${MEDILABO_PASSWORD_BCRYPT:$2a$10$GzMGhp/NWTujVhv4VyYh9eM.aia95IXMsse7Yl6jUC3DC42/VIinq}

# Comptes de SERVICE — patient-service est seulement appelé, jamais appelant :
# il stocke les hashes pour authentifier ses appelants, pas de mot de passe en clair.
medilabo.svc-front-user=${MEDILABO_SVC_FRONT_USER:svc-front}
medilabo.svc-front-password-bcrypt=${MEDILABO_SVC_FRONT_PASSWORD_BCRYPT:$2a$10$Xd3QlU4YmaRxph5pGkq6guQs7RtdxxF/N3X9xVvyJ.wjiEM6MNwFy}
medilabo.svc-assessment-user=${MEDILABO_SVC_ASSESSMENT_USER:svc-assessment}
medilabo.svc-assessment-password-bcrypt=${MEDILABO_SVC_ASSESSMENT_PASSWORD_BCRYPT:$2a$10$cQNaASTAabpd03t9EyP6nOCnf.IlVWfa90iFPXZ571UICn69MCjIG}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
# Log SQL désactivé par défaut : formater et écrire chaque requête coûte du CPU et de l'I/O
# en continu, pour rien en dehors du debug (Green Code). Si besoin en dev, on l'active
# ponctuellement avec -Dspring.jpa.show-sql=true, pas la peine de trainer ça jusqu'en prod.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always