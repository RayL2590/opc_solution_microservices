# Messages de validation front-service.
# Spring Boot auto-configure un MessageSource sur le basename "messages" (aucune config Java requise).
#
# typeMismatch : erreurs de *binding* (conversion String -> type), levees AVANT la Bean Validation.
# Sans ces cles, Spring expose le message brut de l'exception de conversion
# (ex: "Failed to convert ... java.time.LocalDate for value [20333-12-01]") a l'utilisateur.
typeMismatch.dateOfBirth=La date de naissance est invalide (format attendu : jour/mois/annee sur 4 chiffres)
typeMismatch.java.time.LocalDate=La date saisie est invalide
