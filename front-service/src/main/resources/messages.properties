# Messages de validation pour front-service.
# Spring Boot auto-configure un MessageSource sur le basename "messages", pas besoin de config Java.
#
# typeMismatch : erreurs de *binding* (conversion String -> type), levees AVANT la Bean Validation.
# Sans ces cles, l'utilisateur se retrouve avec le message brut de l'exception de conversion
# (genre "Failed to convert ... java.time.LocalDate for value [20333-12-01]").
typeMismatch.dateOfBirth=La date de naissance est invalide (format attendu : jour/mois/annee sur 4 chiffres)
typeMismatch.java.time.LocalDate=La date saisie est invalide
