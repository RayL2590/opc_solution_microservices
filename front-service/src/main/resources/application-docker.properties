# Profil docker : gateway accessible via son nom de service Compose.
medilabo.gateway.base-url=http://gateway-service:8080

# Derrière le Gateway (reverse proxy) : sans ça, les redirections Spring MVC
# ("redirect:/ui/patients") se construisent avec le Host interne vu par le conteneur
# (front-service:8084, que le navigateur ne peut pas résoudre) au lieu du Host public
# (localhost:8080) porté par les en-têtes X-Forwarded-* du Gateway.
server.forward-headers-strategy=framework
