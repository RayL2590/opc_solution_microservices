# Profil docker : gateway accessible via son nom de service Compose.
medilabo.gateway.base-url=http://gateway-service:8080

# Derrière la Gateway (reverse proxy) : sans ceci, les redirections Spring MVC
# ("redirect:/ui/patients") sont construites avec le Host interne vu par le conteneur
# (front-service:8084, non résolvable par le navigateur) au lieu du Host public
# (localhost:8080) porté par les en-têtes X-Forwarded-* de la Gateway.
server.forward-headers-strategy=framework
