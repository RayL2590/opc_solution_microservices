spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: patients
              uri: http://patient-service:8081
              predicates:
                - Path=/patients/**
            - id: notes
              uri: http://notes-service:8082
              predicates:
                - Path=/notes/**
            - id: assessments
              uri: http://assessment-service:8083
              predicates:
                - Path=/assessments/**
            - id: front
              uri: http://front-service:8084
              predicates:
                - Path=/,/ui/**,/css/**,/js/**,/favicon.ico
              filters:
                # Host/proto PUBLICS vus par le navigateur, pas ceux du conteneur.
                # Defaults = comportement docker local inchange ; surcharges en prod par docker-compose.prod.yml (domaine reel + https).
                - AddRequestHeader=X-Forwarded-Host, ${MEDILABO_PUBLIC_HOST:localhost:8080}
                - AddRequestHeader=X-Forwarded-Proto, ${MEDILABO_PUBLIC_PROTO:http}
