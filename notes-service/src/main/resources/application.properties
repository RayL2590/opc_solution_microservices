spring.application.name=notes-service
server.port=8082
spring.mongodb.uri=mongodb://localhost:27017/notesdb

# Création auto des index déclarés par @Indexed (désactivée par défaut depuis Spring Data
# MongoDB 3.0). Sans ce flag, le @Indexed sur Note.patId ne servirait à rien.
spring.data.mongodb.auto-index-creation=true

# Import du .env racine — [.properties] pour choisir le bon loader ; optional pour ne pas planter si absent (Docker).
spring.config.import=optional:file:../.env[.properties]

# Bridge OBLIGATOIRE : @Value("${medilabo.password-bcrypt}") tout seul ne relaxed-bind pas MEDILABO_PASSWORD_BCRYPT.
#
# Syntaxe : ${NOM_DE_LA_VARIABLE:valeur_par_défaut}. Tout ce qui suit le premier ':' est le
# défaut, pas le nom de la variable. Ici le défaut est un hash BCrypt, et son format contient
# lui-même des '$' ($2a$10$<sel><hash>) — d'où cette ligne à l'air illisible.
# Ce défaut sert seulement en dev local sans fichier .env ; en Docker et ailleurs, la valeur
# vient toujours de l'environnement (voir .env.docker.example et docker-compose.yml).
# Défaut DEV : hash bcrypt de 'medilabo123' (le mot de passe en clair n'apparaît jamais — NFR-S3).
medilabo.user=${MEDILABO_USER:medilabo}
medilabo.password-bcrypt=${MEDILABO_PASSWORD_BCRYPT:$2a$10$GzMGhp/NWTujVhv4VyYh9eM.aia95IXMsse7Yl6jUC3DC42/VIinq}

# Comptes de SERVICE — notes-service est seulement appelé, jamais appelant :
# il stocke les hashes pour authentifier ses appelants, pas de mot de passe en clair.
medilabo.svc-front-user=${MEDILABO_SVC_FRONT_USER:svc-front}
medilabo.svc-front-password-bcrypt=${MEDILABO_SVC_FRONT_PASSWORD_BCRYPT:$2a$10$Xd3QlU4YmaRxph5pGkq6guQs7RtdxxF/N3X9xVvyJ.wjiEM6MNwFy}
medilabo.svc-assessment-user=${MEDILABO_SVC_ASSESSMENT_USER:svc-assessment}
medilabo.svc-assessment-password-bcrypt=${MEDILABO_SVC_ASSESSMENT_PASSWORD_BCRYPT:$2a$10$cQNaASTAabpd03t9EyP6nOCnf.IlVWfa90iFPXZ571UICn69MCjIG}
