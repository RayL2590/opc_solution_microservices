spring.application.name=assessment-service
server.port=8083

# Import du .env racine — [.properties] pour choisir le bon loader ; optional pour ne pas planter si absent (Docker).
spring.config.import=optional:file:../.env[.properties]

# Bridge OBLIGATOIRE : @Value("${medilabo.password-bcrypt}") tout seul ne relaxed-bind pas MEDILABO_PASSWORD_BCRYPT.
medilabo.user=${MEDILABO_USER:medilabo}
medilabo.password-bcrypt=${MEDILABO_PASSWORD_BCRYPT:$2a$10$GzMGhp/NWTujVhv4VyYh9eM.aia95IXMsse7Yl6jUC3DC42/VIinq}

# Comptes de SERVICE. assessment-service est à la fois appelé et APPELANT :
# les hashes servent à authentifier ses appelants, et svc-assessment-password (en clair)
# sert à construire le header Basic de ses propres appels vers le Gateway.
medilabo.svc-front-user=${MEDILABO_SVC_FRONT_USER:svc-front}
medilabo.svc-front-password-bcrypt=${MEDILABO_SVC_FRONT_PASSWORD_BCRYPT:$2a$10$Xd3QlU4YmaRxph5pGkq6guQs7RtdxxF/N3X9xVvyJ.wjiEM6MNwFy}
medilabo.svc-assessment-user=${MEDILABO_SVC_ASSESSMENT_USER:svc-assessment}
medilabo.svc-assessment-password-bcrypt=${MEDILABO_SVC_ASSESSMENT_PASSWORD_BCRYPT:$2a$10$cQNaASTAabpd03t9EyP6nOCnf.IlVWfa90iFPXZ571UICn69MCjIG}
# Pas de défaut ici, exprès : un secret en clair dans un fichier commité, ça devient public.
# S'il manque dans l'environnement, le démarrage plante — mieux que de retomber en douce sur une valeur connue.
medilabo.svc-assessment-password=${MEDILABO_SVC_ASSESSMENT_PASSWORD}

# URL de base du Gateway — surchargée en profil docker.
medilabo.gateway.base-url=http://localhost:8080

# Sérialisation JSON : on exclut les champs null des réponses.
spring.jackson.default-property-inclusion=non_null
